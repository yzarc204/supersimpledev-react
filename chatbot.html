<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial;
      margin-top: 0px;
      margin-bottom: 0px;
    }

    .send-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input {
      padding: 12px 20px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;
      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
    }

    .chat-message-robot {
      display: flex;
      align-items: start;

    }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 45px;
    }

    .chat-messages-container {
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }

    .welcome-text {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">
    function ChatInput({ chatMessages, setChatMessages, isLoading, setIsLoading }) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value);
      }

      async function sendMessage() {
        if (!inputText.trim()) {
          return;
        }

        setIsLoading(true);

        const newMessages = [...chatMessages, {
          message: inputText,
          sender: 'user',
          id: crypto.randomUUID()
        }]
        setChatMessages(newMessages);

        await Chatbot.getResponseAsync(inputText)
          .then(response => {
            setChatMessages([...newMessages, {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }]);

            setInputText('');
            setIsLoading(false);
          });
      }

      function handleInputKeyDown(event) {
        console.log(event.key);
        if (event.key == 'Enter') {
          sendMessage()
        }
        if (event.key === 'Escape') {
          setInputText('');
        }
      }

      return (
        <div className="chat-input-container">
          <input
            placeholder="Sent a message to Chatbot"
            size="30"
            className="chat-input"
            value={inputText}
            onChange={saveInputText}
            onKeyDown={handleInputKeyDown}
            disabled={isLoading}
          />
          <button
            onClick={sendMessage}
            disabled={isLoading}
            className="send-button"
          >Send</button>
        </div>
      );
    }

    function ChatMessage({ message, sender }) {
      return (
        <div className={
          sender === 'user'
            ? 'chat-message-user'
            : 'chat-message-robot'
        }>
          {sender === 'robot' && (
            <img src="robot.png" className="chat-message-profile" />
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {sender === 'user' && (
            <img src="user.png" className="chat-message-profile" />
          )}
        </div>
      );
    }

    function ChatMessages({ chatMessages, isLoading }) {
      const chatMessageRef = React.useRef(null);

      React.useEffect(() => {
        const containerElm = chatMessageRef.current;
        if (containerElm) {
          containerElm.scrollTop = containerElm.scrollHeight;
        }
      }, [chatMessages]);

      return (
        <div
          className="chat-messages-container"
          ref={chatMessageRef}
        >

          {chatMessages.length === 0 && (
            <p className="welcome-text">Welcome to chatbot project project! Send a message using textbox below.</p>
          )}

          {chatMessages.length > 0 &&
            chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          {isLoading && (
            <ChatMessage
              message="Loading..."
              sender="robot"
            />
          )}
        </div>
      );
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(false);

      return (
        <div className="app-container">

          <ChatMessages
            chatMessages={chatMessages}
            isLoading={isLoading}
          />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            isLoading={isLoading}
            setIsLoading={setIsLoading}
          />
        </div>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>

</html>
